<main class="page add-page">
  <header class="intro reveal">
    <div>
      <p class="eyebrow">Workspace / Add bike</p>
      <h1>Bring a new ride <span>to life.</span></h1>
      <p>Create a clean bike record and keep your showroom inventory moving.</p>
    </div>
    <div class="hero-orbit" aria-hidden="true"><span>+</span></div>
  </header>

  <section class="card form-card reveal delay-1">
    <div class="section-heading">
      <div class="section-icon">01</div>
      <div><h2>Bike details</h2><p>Start with the essentials.</p></div>
    </div>
    <form (ngSubmit)="saveBike()">
      <div class="form-grid">
      <label>Bike name
        <input type="text" [(ngModel)]="form.name" name="name" placeholder="City Cruiser" required>
      </label>
      <label>Brand
        <input type="text" [(ngModel)]="form.brand" name="brand" placeholder="Trek" required>
      </label>
      <label>Category
        <select [(ngModel)]="form.category" name="category">
          <option value="road">Road</option><option value="mountain">Mountain</option>
          <option value="hybrid">Hybrid</option><option value="electric">Electric</option>
          <option value="bmx">BMX</option>
        </select>
      </label>
      <label>Price
        <input type="number" [(ngModel)]="form.price" name="price" min="0" required>
      </label>
      <label>Stock
        <input type="number" [(ngModel)]="form.stock" name="stock" min="0" step="1" required>
      </label>
      <label class="wide-field">Image URL <span class="optional">optional</span>
        <input type="url" [(ngModel)]="form.photo" name="photo" placeholder="https://images.example.com/bike.jpg">
      </label>
      </div>
      <button type="submit" [disabled]="isSaving">
        <span class="button-shine"></span>
        {{ isSaving ? 'Saving...' : 'Add to inventory' }}
      </button>
    </form>
  </section>

  @if (errorMessage) { <p class="message error reveal" role="alert">{{ errorMessage }}</p> }
  @if (successMessage) { <p class="message success reveal" role="status">{{ successMessage }}</p> }
</main>
